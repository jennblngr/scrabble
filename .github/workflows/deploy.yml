name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys on the VPS at the same time; a newer push waits for
# the one in progress instead of interrupting it halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks and builds shared, backend and frontend: a broken commit
      # stops here and never reaches the VPS.
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # TEMPORARY debug step: prints the fingerprint of the key the runner
      # actually received (never the key itself), to compare against
      # `ssh-keygen -lf ~/.ssh/scrabble_deploy_key.pub` run on the VPS.
      # Remove this step once the fingerprints are confirmed to match.
      - name: Debug key fingerprint
        run: |
          echo "Lines in decoded key: $(wc -l < ~/.ssh/id_deploy)"
          ssh-keygen -lf ~/.ssh/id_deploy

      # .env and packages/frontend/dist are gitignored, so the reset keeps them.
      - name: Run deploy script on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/var/www/scrabble' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; cd '$APP_DIR' && git fetch --prune origin && git reset --hard '$GITHUB_SHA' && ./scripts/deploy.sh"
