<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scrabble</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; }
button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width: 628px; height: 1000px; box-sizing: border-box; padding: 36px; display: flex; flex-direction: column; gap: 18px; background: {{theme.bg}}; color: {{theme.text}}; font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; transition: background 0.2s ease, color 0.2s ease;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <button type="button" style="display: flex; align-items: center; gap: 6px; background: none; border: none; padding: 6px 4px; font-size: 12px; font-weight: 500; color: {{theme.textMuted}};">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Parties
    </button>
    <div style="flex: 1; text-align: center; font-size: 12px; line-height: 1.4; color: {{theme.textMuted}};">
      <span style="color: {{theme.text}}; font-weight: 600;">Vous</span> avez joué <span style="color: {{theme.accentBg}}; font-weight: 700;">ECOLE</span> pour <strong style="color: {{theme.text}};">13 points</strong>
    </div>
    <button type="button" onClick="{{toggle}}" aria-label="Changer de thème" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; border: 1px solid {{theme.border}}; background: {{theme.surface}}; color: {{theme.text}};">
      <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </sc-if>
      <sc-if value="{{notDark}}" hint-placeholder-val="{{true}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </sc-if>
    </button>
  </div>

  <div style="display: flex; gap: 10px;">
    <div style="flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid {{theme.border}}; background: {{theme.surface}};">
      <div style="font-size: 11px; font-weight: 600; color: {{theme.textMuted}};">Vous</div>
      <div style="font-size: 24px; font-weight: 700; color: {{theme.text}}; margin-top: 2px;">19</div>
    </div>
    <div style="flex: 1; padding: 12px 16px; border-radius: 10px; background: {{theme.accentBg}};">
      <div style="font-size: 11px; font-weight: 600; color: {{theme.accentText}}; opacity: 0.85;">joueur2</div>
      <div style="font-size: 24px; font-weight: 700; color: {{theme.accentText}}; margin-top: 2px;">5</div>
    </div>
  </div>

  <div style="display: flex; justify-content: center;">
    <div style="display: grid; grid-template-columns: repeat(15, 36px); grid-auto-rows: 36px; gap: 1px; background: {{theme.boardLine}}; border-radius: 8px; padding: 1px; overflow: hidden;">
      <sc-for list="{{cells}}" as="cell" hint-placeholder-count="225">
        <div style="display: flex; align-items: center; justify-content: center; position: relative; background: {{cell.bg}}; box-shadow: {{cell.shadow}};">
          <sc-if value="{{cell.isTile}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 17px; font-weight: 700; color: {{cell.fg}};">{{cell.label}}</span>
            <span style="position: absolute; right: 3px; bottom: 2px; font-size: 8px; font-weight: 600; color: {{cell.fg}}; opacity: 0.75;">{{cell.pts}}</span>
          </sc-if>
          <sc-if value="{{cell.notTile}}" hint-placeholder-val="{{true}}">
            <span style="font-size: 8.5px; font-weight: 700; color: {{cell.fg}};">{{cell.label}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div>
    <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 10px;">
      <sc-for list="{{rack}}" as="tile" hint-placeholder-count="7">
        <div style="position: relative; width: 52px; height: 52px; border-radius: 6px; background: {{theme.tileBg}}; border: 1px solid {{theme.tileBorder}}; box-shadow: {{theme.tileShadow}}; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 22px; font-weight: 700; color: {{theme.tileText}};">{{tile.l}}</span>
          <span style="position: absolute; right: 5px; bottom: 3px; font-size: 10px; font-weight: 600; color: {{theme.tileText}}; opacity: 0.75;">{{tile.p}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: center; gap: 20px;">
      <button type="button" style="display: flex; align-items: center; gap: 5px; background: none; border: none; padding: 4px; font-size: 12px; font-weight: 500; color: {{theme.textMuted}};">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        Mélanger mes lettres
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 5px; background: none; border: none; padding: 4px; font-size: 12px; font-weight: 500; color: {{theme.textMuted}};">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        Reprendre mes tuiles
      </button>
    </div>
  </div>

  <div style="display: flex; gap: 10px;">
    <button type="button" style="flex: 1.6; padding: 10px 6px; border-radius: 8px; border: none; background: {{theme.accentBg}}; color: {{theme.accentText}}; font-size: 12px; font-weight: 600;">Valider le mot</button>
    <button type="button" style="flex: 0.8; padding: 10px 6px; border-radius: 8px; border: 1px solid {{theme.border}}; background: transparent; color: {{theme.text}}; font-size: 12px; font-weight: 500;">Passer</button>
    <button type="button" style="flex: 1.3; padding: 10px 6px; border-radius: 8px; border: 1px solid {{theme.border}}; background: transparent; color: {{theme.text}}; font-size: 12px; font-weight: 500;">Échanger des tuiles</button>
  </div>

  <div style="text-align: center; font-size: 11px; color: {{theme.textMuted}};">Tuiles restantes dans le sac : {{bagCount}}</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"darkMode":{"editor":"boolean","default":false},"$preview":{"width":628,"height":1000}}'>
const BONUS = {
  '0,0': 'MT', '0,7': 'MT', '7,0': 'MT',
  '1,1': 'MD', '2,2': 'MD', '3,3': 'MD', '4,4': 'MD', '7,7': 'MD',
  '1,5': 'LT', '5,1': 'LT', '5,5': 'LT',
  '0,3': 'LD', '3,0': 'LD', '2,6': 'LD', '6,2': 'LD', '3,7': 'LD', '7,3': 'LD'
};
const WORD_ROW = 7;
const WORD_LETTERS = [
  { c: 5, l: 'E', p: 1 },
  { c: 6, l: 'C', p: 3 },
  { c: 7, l: 'O', p: 1 },
  { c: 8, l: 'L', p: 1 },
  { c: 9, l: 'E', p: 1 }
];
const RACK = [
  { l: 'A', p: 1 }, { l: 'C', p: 3 }, { l: 'O', p: 1 }, { l: 'T', p: 1 },
  { l: 'I', p: 1 }, { l: 'H', p: 4 }, { l: 'A', p: 1 }
];
const LIGHT = {
  bg: '#FAF7EF', text: '#2B2620', textMuted: '#726650', surface: '#FFFEFA',
  border: 'rgba(43,38,32,0.15)', boardLine: 'rgba(43,38,32,0.20)',
  cellEmpty: '#EFE7D6', tileBg: '#F1DBA8', tileBorder: '#C9A661', tileText: '#2B2620',
  accentBg: '#C0392B', accentText: '#FFFFFF',
  ldBg: '#AEDCEB', ldText: '#0F4C5C', mdBg: '#F2C6CE', mdText: '#8C3B4A',
  ltBg: '#2E6E8E', ltText: '#FFFFFF', mtBg: '#C0392B', mtText: '#FFFFFF'
};
const DARK = {
  bg: '#211B14', text: '#F3ECDD', textMuted: '#AB9D84', surface: '#2C2419',
  border: 'rgba(243,236,221,0.14)', boardLine: 'rgba(243,236,221,0.16)',
  cellEmpty: '#2C2419', tileBg: '#3C2F1C', tileBorder: '#6B5330', tileText: '#F3ECDD',
  accentBg: '#C0392B', accentText: '#FFFFFF',
  ldBg: '#1F3F52', ldText: '#9FD4E8', mdBg: '#4A2530', mdText: '#F0B8C4',
  ltBg: '#2E6E8E', ltText: '#FFFFFF', mtBg: '#C0392B', mtText: '#FFFFFF'
};

function buildCells(T) {
  const byCol = {};
  WORD_LETTERS.forEach(function (w) { byCol[w.c] = w; });
  const bonusPalette = {
    LD: { bg: T.ldBg, fg: T.ldText },
    MD: { bg: T.mdBg, fg: T.mdText },
    LT: { bg: T.ltBg, fg: T.ltText },
    MT: { bg: T.mtBg, fg: T.mtText }
  };
  const cells = [];
  for (let r = 0; r < 15; r++) {
    for (let c = 0; c < 15; c++) {
      const rr = Math.min(r, 14 - r);
      const cc = Math.min(c, 14 - c);
      const bonus = BONUS[rr + ',' + cc] || null;
      const tile = r === WORD_ROW ? byCol[c] : null;
      let bg, fg, label, isTile, pts, shadow;
      if (tile) {
        isTile = true; bg = T.tileBg; fg = T.tileText; label = tile.l; pts = tile.p; shadow = T.tileShadow;
      } else if (bonus) {
        isTile = false; bg = bonusPalette[bonus].bg; fg = bonusPalette[bonus].fg; label = bonus; pts = null; shadow = 'none';
      } else {
        isTile = false; bg = T.cellEmpty; fg = 'transparent'; label = ''; pts = null; shadow = 'none';
      }
      cells.push({
        key: r + '-' + c, bg: bg, fg: fg, label: label,
        isTile: isTile, notTile: !isTile, pts: pts, shadow: shadow
      });
    }
  }
  return cells;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: null };
    this.toggle = this.toggle.bind(this);
  }
  toggle() {
    const current = this.state.dark === null ? (this.props.darkMode || false) : this.state.dark;
    this.setState({ dark: !current });
  }
  renderVals() {
    const dark = this.state.dark === null ? (this.props.darkMode || false) : this.state.dark;
    const base = dark ? DARK : LIGHT;
    const theme = Object.assign({}, base, {
      tileShadow: dark ? '0 1px 3px rgba(0,0,0,0.5)' : '0 1px 2px rgba(31,30,29,0.18)'
    });
    return {
      dark: dark,
      notDark: !dark,
      toggle: this.toggle,
      theme: theme,
      cells: buildCells(theme),
      rack: RACK,
      bagCount: 78
    };
  }
}
</script>
</body>
</html>
