# Site config for scrabble.jennblngr.com, to install on the VPS's existing
# host nginx (this VPS also serves other sites — there is no dedicated
# reverse proxy container for this project, see docker-compose.prod.yml).
#
# Install:
#   sudo cp nginx/scrabble.conf /etc/nginx/sites-available/scrabble.jennblngr.com
#   sudo ln -s /etc/nginx/sites-available/scrabble.jennblngr.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d scrabble.jennblngr.com
# certbot rewrites this file in place to add the certificate/SSL directives
# and an HTTP->HTTPS redirect — safe to let it do so.

server {
    listen 80;
    listen [::]:80;
    server_name scrabble.jennblngr.com;

    root /var/www/scrabble/packages/frontend/dist;
    index index.html;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: serve the built static files, falling back to index.html for
    # client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
